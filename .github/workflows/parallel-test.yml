name: Parallel Cross-Browser Testing

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
        test-suite: [smoke, regression, api]
    
    services:
      selenium:
        image: selenium/standalone-${{ matrix.browser }}:latest
        ports:
          - 4444:4444
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Run Test Suite
      run: |
        mvn test -Dcucumber.filter.tags="@${{ matrix.test-suite }}" \
                 -Dbrowser=${{ matrix.browser }} \
                 -DseleniumGrid=http://localhost:4444/wd/hub
      env:
        TEST_SUITE: ${{ matrix.test-suite }}
        BROWSER: ${{ matrix.browser }}
        
    - name: Upload Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: results-${{ matrix.browser }}-${{ matrix.test-suite }}
        path: |
          target/cucumber-reports/
          target/extent-reports/
