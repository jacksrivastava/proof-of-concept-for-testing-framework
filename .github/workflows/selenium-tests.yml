name: Selenium Cucumber Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Choose browser for testing'
        required: true
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
        - edge

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    
    services:
      selenium:
        image: selenium/standalone-${{ matrix.browser }}:latest
        ports:
          - 4444:4444
        options: >-
          --health-cmd "curl -f http://localhost:4444/wd/hub/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Install dependencies
      run: mvn clean compile
      
    - name: Wait for Selenium Grid
      run: |
        timeout 30s bash -c 'until curl -f http://localhost:4444/wd/hub/status; do sleep 2; done'
        
    - name: Run Cucumber Tests
      run: |
        mvn test -Dbrowser=${{ matrix.browser }} -DseleniumGrid=http://localhost:4444/wd/hub
      env:
        BROWSER: ${{ matrix.browser }}
        SELENIUM_HUB_URL: http://localhost:4444/wd/hub
        
    - name: Generate Cucumber Reports
      if: always()
      run: mvn verify -DskipTests=true
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.browser }}
        path: |
          target/cucumber-reports/
          target/extent-reports/
          target/screenshots/
          target/surefire-reports/
          
    - name: Upload Screenshots
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: screenshots-${{ matrix.browser }}
        path: target/screenshots/
        
    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results (${{ matrix.browser }})
        path: target/surefire-reports/*.xml
        reporter: java-junit
